<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #151e19;
            color: #d5d8ce;
            font-family: Arial, "Noto Sans KR", sans-serif;
            font-size: 13px;
        }

        .wrap {
            display: flex;
            align-items: stretch;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .lead {
            display: flex;
            flex: 0 0 180px;
            flex-direction: column;
            justify-content: center;
            padding: 16px 18px;
        }

        .eyebrow {
            color: #a8b8a0;
            font-size: 10px;
            letter-spacing: 0.16em;
        }

        .lead strong {
            margin-top: 6px;
            font: italic 22px Georgia, serif;
            font-weight: 400;
        }

        .lead small {
            margin-top: 5px;
            color: #9ba59b;
        }

        #profileList {
            display: flex;
        }

        .person {
            display: grid;
            flex: 0 0 205px;
            grid-template-columns: 70px 1fr;
            align-items: center;
            gap: 13px;
            padding: 16px 14px;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.25s ease;
        }

.person:hover {
    background-color: rgba(168, 184, 160, 0.1);
    transform: translateY(-3px);
}

.person:focus-visible {
    outline: 1px solid #a8b8a0;
    outline-offset: -3px;
}

        .photo {
            position: relative;
            width: 70px;
            height: 100px;
            overflow: hidden;
            background: #27342b;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            display: none;
            position: absolute;
            inset: 0;
            place-items: center;
            padding: 5px;
            background: #27342b;
            color: #a8b8a0;
            text-align: center;
            font-size: 10px;
        }

        .name {
            margin-bottom: 5px;
            color: #d5d8ce;
            font-size: 14px;
        }

        .meta {
            color: #9ba59b;
            font-size: 11px;
            line-height: 1.55;
        }

        .label {
            margin-bottom: 4px;
            color: #a77b65;
            font-size: 9px;
            letter-spacing: 0.12em;
        }

        @media (max-width: 600px) {
            .lead {
                flex-basis: 140px;
                padding: 12px;
            }

            .person {
                flex-basis: 190px;
                grid-template-columns: 60px 1fr;
                padding: 12px;
            }

            .photo {
                width: 60px;
                height: 85px;
            }
        }
    </style>
</head>

        people.forEach(function (person, index) {
            const article = document.createElement("a");

            article.target = "_top";

            const photoArea = document.createElement("div");
            photoArea.className = "photo";

            const photo = document.createElement("img");
            photo.src = person.photo;
            photo.alt = person.name + "의 당시 사진";

                photo.style.display = "none";
                placeholder.style.display = "grid";
            };
